<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0d0f'/%3E%3Ctext x='16' y='24' font-size='22' font-weight='900' text-anchor='middle' fill='%23d1a548' font-family='Arial'%3EV%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0f" />
    <script>
      // Runs before the page is drawn, so the saved theme shows from the first moment.
      // Dark is the default; change 'dark' below if you want new visitors to start in light.
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('vexaro_theme') === 'light') theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f1ea');
        }
      })();
    </script>
    <meta
      name="description"
      content="VEXARO - clothing for men, women and kids, delivered across Bangladesh."
    />
    <title>VEXARO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Hind+Siliguri:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
